spring.application.name=taskflow-pro

# --- Database ---------------------------------------------------------
# Override these with real values via environment variables in production.
# Never commit real credentials.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskflow_pro}
spring.datasource.username=${DB_USER:taskflow}
spring.datasource.password=${DB_PASSWORD:taskflow}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- CORS ---------------------------------------------------------------
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# --- AI / LLM -------------------------------------------------------------
# Disabled by default: the app runs fully offline using the keyword-overlap
# fallback heuristic. Set to true and supply an API key via environment
# variable (never in this file) to wire up a real LLM call.
ai.llm.enabled=${AI_LLM_ENABLED:false}

server.port=${PORT:8080}
